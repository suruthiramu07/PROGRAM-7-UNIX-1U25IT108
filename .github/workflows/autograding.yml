name: Linux Practical Autograding

on:
  push:
  workflow_dispatch:

jobs:

  autograde:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Student Submission
        uses: actions/checkout@v4

      - name: Give Execute Permission
        run: |
          chmod +x student_solution.sh
          chmod +x test.sh

      - name: Run Test Cases
        run: ./test.sh
